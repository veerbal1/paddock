services:
  nats:
    image: nats:2.11
    ports:
      - "1883:1883"
      - "8222:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    command: ["-c", "/etc/nats/nats.conf", "-js"]

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paddock
      POSTGRES_PASSWORD: paddock
      POSTGRES_DB: paddock
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
